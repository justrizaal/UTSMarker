<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS AR MARKER</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden; text-align: center;">
    <a-scene embedded arjs="detectionMode:mono_and_matrix;matrixCodeType:3x3_PARITY65">
        <a-marker preset="hiro">
            <a-gltf-model id="supraModel" src="Supra/scene.gltf" position="0 0 0" scale="1.5 1.5 1.5"></a-gltf-model>
        </a-marker>

        <a-marker preset="kanji">
            <a-gltf-model id="ferrariModel" src="ferrari/scene.gltf" position="0 0 0" scale="100 100 100"></a-gltf-model>
        </a-marker>

        <a-marker type="barcode" value="5">
            <a-gltf-model id="lamboModel" src="lamborghini/scene.gltf" position="0 0 0" scale="100 100 100"></a-gltf-model>
        </a-marker>

        <a-entity camera>
            <a-cursor></a-cursor>
        </a-entity>
    </a-scene>

    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
        <button onclick="rotateLeft()" style="padding: 10px 20px; font-size: 16px;">Rotate Left</button>
        <button onclick="rotateRight()" style="padding: 10px 20px; font-size: 16px;">Rotate Right</button>
        <button onclick="moveForward()" style="padding: 10px 20px; font-size: 16px;">Move Forward</button>
        <button onclick="moveBackward()" style="padding: 10px 20px; font-size: 16px;">Move Backward</button>
        <button onclick="playCarSound('supraModel')" style="padding: 10px 20px; font-size: 16px;">Sound Supra</button>
        <button onclick="playCarSound('ferrariModel')" style="padding: 10px 20px; font-size: 16px;">Sound Ferrari</button>
        <button onclick="zoomIn('supraModel')" style="padding: 10px 20px; font-size: 16px;">Zoom In Supra</button>
        <button onclick="zoomOut('supraModel')" style="padding: 10px 20px; font-size: 16px;">Zoom Out Supra</button>
        <button onclick="zoomIn('ferrariModel')" style="padding: 10px 20px; font-size: 16px;">Zoom In Ferrari</button>
        <button onclick="zoomOut('ferrariModel')" style="padding: 10px 20px; font-size: 16px;">Zoom Out Ferrari</button>
    </div>

    <audio id="supraSound" src="sounds/supra_sound.mp3"></audio>
    <audio id="ferrariSound" src="sounds/ferrari_sound.mp3"></audio>

    <script>
        function updateModelPosition(modelId, direction) {
            let model = document.getElementById(modelId);
            if (model) {
                let currentPosition = model.getAttribute('position');
                let currentRotation = model.getAttribute('rotation');
                
                let angleRad = -currentRotation.y * (Math.PI / 180);
                let deltaX = Math.sin(angleRad) * direction;
                let deltaZ = Math.cos(angleRad) * direction;
                
                model.setAttribute('animation', {
                    property: 'position',
                    to: `${currentPosition.x + deltaX} ${currentPosition.y} ${currentPosition.z + deltaZ}`,
                    dur: 1000,
                    easing: 'linear'
                });
            }
        }

        function rotateModel(modelId, direction) {
            let model = document.getElementById(modelId);
            if (model) {
                let currentRotation = model.getAttribute('rotation');
                let rotationOffset = (modelId === 'ferrariModel') ? -1 : 1;
                model.setAttribute('animation', {
                    property: 'rotation',
                    to: `${currentRotation.x} ${currentRotation.y + (rotationOffset * direction * 30)} ${currentRotation.z}`,
                    dur: 1000,
                    easing: 'linear'
                });
            }
        }

        function rotateLeft() {
            rotateModel('supraModel', -1);
            rotateModel('ferrariModel', -1);
            rotateModel('lamboModel', -1);
        }

        function rotateRight() {
            rotateModel('supraModel', 1);
            rotateModel('ferrariModel', 1);
            rotateModel('lamboModel', 1);
        }

        function moveForward() {
            updateModelPosition('supraModel', -1);
            updateModelPosition('ferrariModel', -1);
            updateModelPosition('lamboModel', -1);
        }

        function moveBackward() {
            updateModelPosition('supraModel', 1);
            updateModelPosition('ferrariModel', 1);
            updateModelPosition('lamboModel', 1);
        }

        function playCarSound(modelId) {
            let soundElement = document.getElementById(modelId === 'supraModel' ? "supraSound" : "ferrariSound");
            if (soundElement) {
                soundElement.currentTime = 0;
                soundElement.play().catch(error => console.log("Playback failed:", error));
            }
        }

        function zoomIn(modelId) {
            let model = document.getElementById(modelId);
            if (model) {
                let currentScale = model.getAttribute('scale');
                model.setAttribute('scale', `${currentScale.x * 1.2} ${currentScale.y * 1.2} ${currentScale.z * 1.2}`);
            }
        }

        function zoomOut(modelId) {
            let model = document.getElementById(modelId);
            if (model) {
                let currentScale = model.getAttribute('scale');
                model.setAttribute('scale', `${currentScale.x * 0.8} ${currentScale.y * 0.8} ${currentScale.z * 0.8}`);
            }
        }
    </script>
</body>
</html>
